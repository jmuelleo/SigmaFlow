# REZEPT DES PAPERS, ABER MIT EFFEKTIVER BATCH 32 STATT 64.
#
# WARUM DIESE VARIANTE UEBERHAUPT
#   conf_flow_paper.yaml setzt `accum_grad_batches: 2`. Mit batch_size 32 ergibt
#   das eine effektive Batch von 64 -- genau den Wert der publizierten
#   SigmaDock/conf/training/slurm.yaml. Der PAPERTEXT nennt dagegen 32.
#   Hier ist 32 gewaehlt, also die Zahl aus dem Text.
#
#   Das ist eine bewusste Abweichung von der ausgelieferten Konfiguration und
#   gehoert in die Liste der Unterschiede.
#
# WARUM NICHT EINFACH FINAL_ACCUM=1 UEBERGEBEN
#   train_final_72h.slurm prueft `FINAL_ACCUM` gegen die YAML NUR, wenn
#   FINAL_ACCUM != 1. Bei FINAL_ACCUM=1 und `accum_grad_batches: 2` in der YAML
#   wuerde also STILL mit Akkumulation 2 trainiert, waehrend die
#   Horizontrechnung mit 1 rechnet -- der Scheduler liefe dann ueber die
#   doppelte Streckenlaenge. Genau die Abweichung, die die Pruefung
#   verhindern soll, faellt durch diese Luecke. Deshalb steht der Wert hier
#   ausdruecklich auf 1.
#
# Trainingskonfiguration fuer die Flow-Arme, so nah am publizierten
# SigmaDock-Rezept wie die Daten auf ARC es zulassen.
#
# WOZU
#   Unsere bisherigen Laeufe haben `--config` nie uebergeben. Jede Einstellung,
#   die die Kommandozeile nicht setzt, fiel deshalb auf den Dataclass-Vorgabewert
#   zurueck, und acht davon weichen vom publizierten Wert ab. Diese Datei setzt
#   sie. Sie ist aus SigmaDock/conf/training/slurm.yaml abgeleitet.
#
# ZWEI FALLEN
#   1. scripts/train.py:49 ueberspringt Schluessel, die RunConfig nicht kennt,
#      STILL. Ein Tippfehler wirkt also nicht, er verschwindet. Alle Schluessel
#      hier sind gegen SigmaFlow_Minimal/src/sigmadock/config.py geprueft.
#      rot_score_method und rot_score_scaling fehlen dort bewusst -- sie sind
#      diffusionsspezifisch -- und stehen deshalb NICHT in dieser Datei.
#   2. Die Kommandozeile schlaegt die YAML. Was train_final_72h.slurm als Flag
#      uebergibt, gewinnt. Deshalb stehen max_epochs, max_steps, seed, devices,
#      accelerator, num_workers und data_dir hier NICHT drin; die kommen aus
#      dem Horizont.
#
# WAS BEWUSST ABWEICHT
#   train_exps: das Original trainiert auf general UND refined. refined ist auf
#   ARC nie aus pdbbind/raw/P-L.tar.gz entpackt worden, also general allein.
#   val_exps: das Original validiert auf pdbbind-core, ebenfalls nicht entpackt.
#   Da Early Stopping aus ist und der Endpunkt last.ckpt ist, waehlt die
#   Validierung kein Modell aus; sie kostet nur Zeit.

# --- Daten ---
train_exps:
  - pdbbind-general
val_exps:
  - posebusters
test_exps:
  - posebusters

# --- Hardware ---
# Eine GPU, also kein ddp. Das Original setzt hier ddp fuer vier Karten.
strategy: auto
cuda_precision: high

# --- Trainingsschleife ---
# Das Original setzt batch_size 64. config.py teilt den Wert durch world_size,
# er ist also GLOBAL. Auf einer Karte erreichen wir dieselbe globale Batch als
# 32 physisch mal 2 Akkumulation. Passt batch 64 physisch in den Speicher
# (A100 80GB), dann batch_size 64 und accum_grad_batches 1 -- gleiche
# Optimierung, weniger Zeit.
batch_size: 32
accum_grad_batches: 1
val_check_interval: 512
val_cycles: 2
cache_cycles: 8
cache_factor: 2

# --- Modell ---
sphere_channels: 128
edge_channels: 32
distance_expansion_dim: 32
num_heads: 4
num_layers: 6
l_max_list: [3]
m_max_list: [2]
t_emb_dim: 32
t_emb_scale: 512.0
smearing_type: fourier
radial_type: bessel

# --- Verlustgewichte ---
trans_score_weight: 2.0
rot_score_weight: 0.5

# --- Optimierer ---
# ACHTUNG: 1.0e-4 und NICHT 1e-4. In YAML 1.1 ist `1e-4` ein STRING, der
# Float-Resolver verlangt einen Dezimalpunkt in der Mantisse. SigmaDocks
# eigene slurm.yaml hat hier 1e-4 und ist damit so nicht lauffaehig: AdamW
# bekommt die Lernrate als Zeichenkette und stirbt an `0.0 <= lr`.
# Genau daran sind die Jobs 8688976 und 8688977 nach sechs Minuten gescheitert.
weight_decay: 0.1
attention_dropout: 0.3
edge_dropout: 0.1
betas: [0.9, 0.998]
optimizer_eps: 1.0e-08
max_lr_start: 1.0e-4
min_lr_start: 1.0e-5
init_lr_start: 1.0e-6
grad_clip: 4.0
ema_halflife: 8

# --- Struktur und Graph ---
lig_coordinate_distance_noise: 0.0
prot_coordinate_distance_noise: 0.02
pocket_com_noise: 1.0
pocket_distance_noise: 0.5
alignment_rmsd_tolerance: 1.0

# --- Schalter ---
# pb_check filtert die Startkonformere mit PoseBusters. Das ist die einzige
# Aenderung hier, die spuerbar Zeit kostet, und zugleich die einzige, die
# gezielt auf die PB-Validitaet der erzeugten Posen wirkt -- also auf die
# Groesse, die das kombinierte Orakel begrenzt (85,0 gegen 97,7 auf PB308).
# CachedRecycleWrapper mit cache_cycles 8 verwendet jedes erzeugte Beispiel
# achtmal, der Aufwand faellt also einmal pro acht Nutzungen an.
force_retry: true
pb_check: true
random_rotation: true

# NACHGETRAGEN 2026-09-07. Stand im publizierten Rezept, fehlte hier, und die
# Dataclass-Vorgabe ist FALSE (config.py:65).
#
# WAS ES TUT
#   Es schaltet KEINE Kanten an oder aus. Der einzige Wirkort ist
#   `StructuralConfig.__post_init__` (config.py:77): die Einstellung waehlt
#   zwischen `HPARAMS.all_degrees` und `HPARAMS.global_degrees`, und dieser
#   Vektor ist ein NORMIERUNGSTEILER im Eingabeblock
#   (input_block.py:121, `embedding / average_degrees[...]`).
#
#       False -> [3.3, 10,   3.5, 27, 1.8, 21]
#       True  -> [9.6, 16.1, 3.5, 27, 2.9, 21]
#
#   Vier der sechs Werte aendern sich um Faktor 1,6 bis 2,9. Die
#   Kanteneinbettungen werden also anders skaliert.
#
# WARUM ES HIER STEHEN MUSS
#   `conf_sigmadock_paper_b32.yaml` setzt es auf true. Ohne diesen Eintrag
#   trainierten die Flow-Arme mit einer ANDEREN Normierung als der
#   SigmaDock-Arm -- ein Unterschied mitten im Vergleich, dessen ganzer Zweck
#   der Armvergleich ist. Jetzt sind beide gleich UND beide wie im Paper.
#
#   Preis: die 72-h-Familie lief ohne --config und damit mit false. Der neue
#   Vergleich unterscheidet sich von ihr also auch in diesem Punkt. Das
#   gehoert in die Liste der Unterschiede.
include_protein_ligand_interactions: true
