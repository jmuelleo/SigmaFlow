n_behaviour_files: 10/10
frame_fix: PRESENT   # adjungierter Transport Welt -> Koerper vorhanden
rotation_target_R1: identity   # R_1 = I; R_t ist Delta-Rotation gegen die Kristallorientierung von pos_0
rotation_convention: >-
    Rdot = R * Omega  (KOERPER / linkstrivialisiert). Ziel log(R_t^T R_1)/(1-t); Integrator R_next = R_t @ exp(v dt); Netzausgabe wird per R_t^T w R_t transportiert. Numerisch verifiziert: audits/frame_convention_audit.py
training_objective: conditional flow matching, MSE auf u_t (trans) und u_t_R (rot)
source_distribution: trans_0 ~ N(0, I) (taschenzentriert, /2.7 A); R_0 ~ Haar auf SO(3)
config: arc/final_config.sh   # batch_size, seed, precision, max_epochs
batch_size: FROM_final_config.sh
seed: FROM_final_config.sh
written_utc: 2026-08-16T15:25:22Z
known_caveats:
  - so3_utils.Log ist nahe 180 Grad begrenzt genau (Omega-Clamp auf +-(1-1e-7)). Relativer Fehler auf dem Trainingsziel: median 5e-7, p99 3e-4, max 5e-3. Gegen einen Rotationsfehler von 145 Grad belanglos - Caveat, kein Blocker.
  - Der Docstring in calc_rot_vector_field nennt die Groesse 'right trivialised'. Nach ueblicher Konvention ist sie LINKS-trivialisiert (Koerperframe). Reine Benennungsfrage, Mathematik und Code sind konsistent.
  - R_1 = I: das Rotationsziel ist per Konstruktion die Identitaet. Eine informative Rotationsquelle ist in dieser Parametrisierung nicht sinnvoll messbar (dafuer EXP-100).
  - Val- und Testsatz sind beide posebusters (aus SigmaDocks Setup geerbt). Trifft beide Methoden identisch, verzerrt den Vergleich also nicht.
